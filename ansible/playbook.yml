---
# memory_gardener_scope chooses how the job runs:
#   system (default): a dedicated system user and hardened system units; needs root.
#   user: the connecting user's own systemd user units under $HOME; no root,
#         and git uses that user's existing SSH access. Needs lingering
#         (loginctl enable-linger) for the timer to fire while logged out.
- name: Deploy memory-gardener
  hosts: memory_gardener
  become: "{{ (memory_gardener_scope | default('system')) == 'system' }}"

  pre_tasks:
    - name: Resolve paths for the chosen scope
      ansible.builtin.set_fact:
        memory_gardener_user_scope: "{{ memory_gardener_scope == 'user' }}"
        memory_gardener_binary: "{{ (memory_gardener_scope == 'user') | ternary(ansible_env.HOME ~ '/.local/bin/memory-gardener', memory_gardener_binary) }}"
        memory_gardener_data_dir: "{{ (memory_gardener_scope == 'user') | ternary(ansible_env.HOME ~ '/.local/share/memory-gardener', memory_gardener_data_dir) }}"
        memory_gardener_config_dir: "{{ (memory_gardener_scope == 'user') | ternary(ansible_env.HOME ~ '/.config/memory-gardener', memory_gardener_config_dir) }}"
        memory_gardener_unit_dir: "{{ (memory_gardener_scope == 'user') | ternary(ansible_env.HOME ~ '/.config/systemd/user', '/etc/systemd/system') }}"

    - name: Check the scope
      ansible.builtin.assert:
        that: memory_gardener_scope in ['system', 'user']
        quiet: true

  tasks:
    - name: Record the commit being deployed
      ansible.builtin.command:
        cmd: git describe --tags --always --dirty
        chdir: "{{ playbook_dir }}/.."
      register: memory_gardener_git_version
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false

    - name: Build memory-gardener locally
      ansible.builtin.command:
        cmd: >-
          go build -trimpath
          -ldflags "-s -w -X main.version={{ memory_gardener_git_version.stdout }}"
          -o {{ playbook_dir }}/../memory-gardener-{{ memory_gardener_goos }}-{{ memory_gardener_goarch }} .
        chdir: "{{ playbook_dir }}/.."
      environment:
        CGO_ENABLED: "0"
        GOOS: "{{ memory_gardener_goos }}"
        GOARCH: "{{ memory_gardener_goarch }}"
        GOTOOLCHAIN: "{{ memory_gardener_go_toolchain }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

    - name: Prepare the system account
      when: not memory_gardener_user_scope
      block:
        - name: Install git
          ansible.builtin.package:
            name: git
            state: present

        - name: Create group
          ansible.builtin.group:
            name: "{{ memory_gardener_group }}"
            system: true

        - name: Create user
          ansible.builtin.user:
            name: "{{ memory_gardener_user }}"
            group: "{{ memory_gardener_group }}"
            home: "{{ memory_gardener_data_dir }}"
            create_home: false
            system: true
            shell: /usr/sbin/nologin

    - name: Create directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ omit if memory_gardener_user_scope else item.owner }}"
        group: "{{ omit if memory_gardener_user_scope else memory_gardener_group }}"
        mode: "0750"
      loop:
        - {path: "{{ memory_gardener_data_dir }}", owner: "{{ memory_gardener_user }}"}
        - {path: "{{ memory_gardener_config_dir }}", owner: root}
        - {path: "{{ memory_gardener_binary | dirname }}", owner: root}
        - {path: "{{ memory_gardener_unit_dir }}", owner: root}
      loop_control:
        label: "{{ item.path }}"

    - name: Install binary
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../memory-gardener-{{ memory_gardener_goos }}-{{ memory_gardener_goarch }}"
        dest: "{{ memory_gardener_binary }}"
        owner: "{{ omit if memory_gardener_user_scope else 'root' }}"
        group: "{{ omit if memory_gardener_user_scope else 'root' }}"
        mode: "0755"

    - name: Install environment
      ansible.builtin.template:
        src: templates/memory-gardener.env.j2
        dest: "{{ memory_gardener_config_dir }}/memory-gardener.env"
        owner: "{{ omit if memory_gardener_user_scope else 'root' }}"
        group: "{{ omit if memory_gardener_user_scope else memory_gardener_group }}"
        mode: "0640"
      no_log: true

    - name: Install policy
      ansible.builtin.copy:
        content: "{{ memory_gardener_policy | to_nice_json }}\n"
        dest: "{{ memory_gardener_config_dir }}/policy.json"
        owner: "{{ omit if memory_gardener_user_scope else 'root' }}"
        group: "{{ omit if memory_gardener_user_scope else memory_gardener_group }}"
        mode: "0640"

    - name: Install git SSH key
      ansible.builtin.copy:
        content: "{{ memory_gardener_ssh_private_key }}"
        dest: "{{ memory_gardener_config_dir }}/id_git"
        owner: "{{ omit if memory_gardener_user_scope else memory_gardener_user }}"
        group: "{{ omit if memory_gardener_user_scope else memory_gardener_group }}"
        mode: "0400"
      when: memory_gardener_ssh_private_key | length > 0
      no_log: true

    - name: Install git SSH known hosts
      ansible.builtin.copy:
        content: "{{ memory_gardener_ssh_known_hosts }}"
        dest: "{{ memory_gardener_config_dir }}/known_hosts"
        owner: "{{ omit if memory_gardener_user_scope else 'root' }}"
        group: "{{ omit if memory_gardener_user_scope else memory_gardener_group }}"
        mode: "0640"
      when: memory_gardener_ssh_known_hosts | length > 0

    - name: Install systemd units
      ansible.builtin.template:
        src: "templates/{{ item }}.j2"
        dest: "{{ memory_gardener_unit_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - memory-gardener.service
        - memory-gardener.timer
      register: memory_gardener_units

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
        scope: "{{ memory_gardener_scope }}"
      when: memory_gardener_units is changed

    - name: Enable and start the timer
      ansible.builtin.systemd:
        name: memory-gardener.timer
        enabled: true
        state: started
        scope: "{{ memory_gardener_scope }}"

    - name: Verify the installed version
      ansible.builtin.command:
        cmd: "{{ memory_gardener_binary }} -version"
      register: memory_gardener_installed_version
      changed_when: false
      failed_when: memory_gardener_installed_version.stdout != memory_gardener_git_version.stdout

    # Reads the env file the way systemd would, then checks without the judge
    # and without writing anything.
    - name: Verify the configuration with a read-only run
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - >-
            set -a; . {{ memory_gardener_config_dir }}/memory-gardener.env; set +a;
            exec {{ memory_gardener_binary }} -no-judge
      become_user: "{{ omit if memory_gardener_user_scope else memory_gardener_user }}"
      environment:
        HOME: "{{ memory_gardener_user_scope | ternary(ansible_env.HOME, memory_gardener_data_dir) }}"
      register: memory_gardener_verify
      changed_when: false
      when: memory_gardener_verify_run | default(true) | bool

    - name: Show the read-only run
      ansible.builtin.debug:
        msg: "{{ memory_gardener_verify.stdout_lines[:4] }}"
      when: memory_gardener_verify is not skipped
